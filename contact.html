<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Tekevol</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/contact.css">
</head>
<body>

  <header>
    <div class="header-row container">
      <a href="index.html">
        <img src="assets/images/logo/logo-full.svg" alt="Tekevol" height="40">
      </a>
      <nav>
        <ul>
          <li><a href="services.html">Services</a></li>
          <li><a href="why-us.html">Why Us</a></li>
          <li><a href="industries.html">Industries</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <a href="contact.html" class="btn btn-primary">Book Your Free Audit</a>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <h1>Get Your Free Audit</h1>
        <form class="contact-form">
          <input type="text" name="name" placeholder="Your Name" required>
          <input type="email" name="email" placeholder="Your Email" required>
          <input type="text" name="website" placeholder="Website URL" required>
          <textarea name="message" rows="5" placeholder="Tell us about your project"></textarea>
          <button type="submit" class="btn btn-accent">Send Request</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Tekevol. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
